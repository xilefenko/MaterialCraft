[package]
name = "materialcraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Procedural, node-based material authoring engine in pure Rust"
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace]
members = ["crates/spp-reader", "crates/substance", "crates/parity", "crates/editor", "crates/brush", "crates/starter", "crates/perf"]

# Suite lints (same as PhotoCraft). Every member crate inherits them with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# The root package can't inherit `forbid`: its gpu3d module (glow's OpenGL calls are all `unsafe fn`) needs a
# module-level `allow`, which `forbid` doesn't permit. Here `unsafe_code` is `deny`
# instead, so `unsafe` anywhere else in the package is still an error. Keep the rest in sync with the table above.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[features]
default = []
# OpenGL viewport renderer (gpu3d) for the editor and the gpu_shot/scene_shot examples; also turns on GPU compute
# and the shared Craft libraries, as the editor uses both. (The file dialogs, rfd, live in crates/editor now.)
gui = ["dep:eframe", "gpu", "craft"]
gpu = ["dep:wgpu", "dep:pollster"]
# shared Craft libraries (MIT OR Apache-2.0): safe saves, settings, docking UI, colour management
craft = ["dep:craft-atomic", "dep:craft-settings", "dep:craft-cms", "dep:craft-ui", "dep:craft-quit", "dep:serde"]
cms = ["dep:craft-cms"]

[dependencies]
wgpu = { version = "22", optional = true, default-features = false, features = ["wgsl", "dx12", "metal"] }
pollster = { version = "0.3", optional = true }
eframe = { version = "0.36", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

# One craft-libs revision for the whole workspace (crates/editor pins the same one).
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "04e83f095ab080c5672243514f9a44ca6364b0e2", optional = true }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "04e83f095ab080c5672243514f9a44ca6364b0e2", optional = true }
craft-cms = { git = "https://github.com/storytold/craft-libs", rev = "04e83f095ab080c5672243514f9a44ca6364b0e2", optional = true }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "04e83f095ab080c5672243514f9a44ca6364b0e2", optional = true, features = ["serde"] }
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "04e83f095ab080c5672243514f9a44ca6364b0e2", optional = true, features = ["egui"] }
serde = { version = "1", features = ["derive"], optional = true }

[[bin]]
name = "materialcraft"
path = "src/main.rs"

[[example]]
name = "gpu_shot"
path = "examples/gpu_shot.rs"
required-features = ["gui"]

[[example]]
name = "scene_shot"
path = "examples/scene_shot.rs"
required-features = ["gui"]

[[example]]
name = "viewport_bench"
path = "examples/viewport_bench.rs"
required-features = ["gui"]

[[example]]
name = "uv_view_check"
path = "examples/uv_view_check.rs"
required-features = ["gui"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
