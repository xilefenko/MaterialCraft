[package]
name = "materialcraft-substance"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Imports Substance 3D Painter projects (.spp) into MaterialCraft documents, on top of spp-reader"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
spp-reader = { path = "../spp-reader" }
materialcraft = { path = "../.." }
# replays imported brush strokes with MaterialCraft's brush engine
materialcraft-brush = { path = "../brush" }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }

[[bin]]
name = "mcsub"
path = "src/bin/mcsub.rs"

[lints]
workspace = true
